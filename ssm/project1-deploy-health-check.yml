
schemaVersion: '2.2'
description: Deploy and verify a pinned Project 1 health-check script

parameters:
  CommitSha:
    type: String
    description: Full 40-character Git commit SHA
    interpolationType: ENV_VAR
    allowedPattern: '^[0-9a-f]{40}$'

mainSteps:
  - action: aws:runShellScript
    name: deployHealthCheck
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: '120'
      runCommand:
        - |
          #!/bin/bash
          set -euo pipefail

          : "${SSM_CommitSha:?Missing commit SHA}"
          [[ "$SSM_CommitSha" =~ ^[0-9a-f]{40}$ ]]

          target="/home/ssm-user/project1/scripts/server-health-check.sh"
          backup="${target}.previous"
          candidate=""
          replacement_started=false

          rollback() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ] &&
               [ "$replacement_started" = true ]; then
              echo "Deployment failed. Restoring previous version."
              cp -p "$backup" "$target" ||
                echo "ERROR: Automatic rollback failed!"
            fi

            if [ -n "$candidate" ]; then
              rm -f -- "$candidate"
            fi

            exit "$result"
          }

          trap rollback EXIT

          test -f "$target"

          candidate=$(mktemp "${target}.new.XXXXXX")

          url="https://raw.githubusercontent.com/milanriman1995/aws-linux-operations-incident-response/${SSM_CommitSha}/scripts/server-health-check.sh"

          curl --fail --location --silent --show-error \
            --retry 2 \
            --proto '=https' \
            --proto-redir '=https' \
            --output "$candidate" "$url"

          test -s "$candidate"
          bash -n "$candidate"

          cp -p "$target" "$backup"
          chown --reference="$target" "$candidate"
          chmod --reference="$target" "$candidate"

          replacement_started=true
          mv -f "$candidate" "$target"

          runuser -u ssm-user -- bash "$target"

          replacement_started=false
          echo "Deployment successful: $SSM_CommitSha"

