
schemaVersion: '2.2'
description: Deploy a pinned version of the Project 1 Linux health check

parameters:
  CommitSha:
    type: String
    description: Full 40-character Git commit SHA
    interpolationType: ENV_VAR
    allowedPattern: '^[0-9a-f]{40}$'

mainSteps:
  - action: aws:runShellScript
    name: deployHealthCheck
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: '120'
      runCommand:
        - |
          #!/bin/bash
          set -euo pipefail

          : "${SSM_CommitSha:?Missing commit SHA}"

          [[ "$SSM_CommitSha" =~ ^[0-9a-f]{40}$ ]] || exit 1

          target="/home/ssm-user/project1/scripts/server-health-check.sh"
          backup="${target}.previous"
          candidate=$(mktemp "${target}.new.XXXXXX")
          installed=false

          cleanup() {
            result=$?
            if [ "$result" -ne 0 ] && [ "$installed" = true ]; then
              if [ -f "$backup" ]; then
                cp -p "$backup" "$target"
                echo "Previous version restored"
              fi
            fi
            rm -f "$candidate"
          }
          trap cleanup EXIT

          url="https://raw.githubusercontent.com/milanriman1995/aws-linux-operations-incident-response/${SSM_CommitSha}/scripts/server-health-check.sh"

          echo "Downloading revision: $SSM_CommitSha"

          curl --fail --location --silent --show-error \
            --retry 2 \
            --proto '=https' \
            --proto-redir '=https' \
            --output "$candidate" "$url"

          test -s "$candidate"
          bash -n "$candidate"

          if [ -f "$target" ]; then
            cp -p "$target" "$backup"
            chown --reference="$target" "$candidate"
          else
            chown ssm-user:ssm-user "$candidate"
          fi

          chmod 755 "$candidate"
          mv -f "$candidate" "$target"
          installed=true

          bash "$target"

          echo "Deployment verified: $SSM_CommitSha"

