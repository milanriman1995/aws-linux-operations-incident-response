
name: Deploy Health Check to EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project1-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Bash syntax
        run: |
          bash -n scripts/server-health-check.sh
          bash -n tests/test-server-health-check.sh

      - name: Run automated tests
        run: bash tests/test-server-health-check.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: Project1Deployment

      - name: Deploy approved commit
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$INSTANCE_ID"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "Deploying commit: $COMMIT_SHA"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "project1-deploy-health-check-v2" \
            --document-version "1" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --comment "Project 1 GitHub deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "Remote command completed"
          else
            echo "Remote deployment failed or timed out"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

