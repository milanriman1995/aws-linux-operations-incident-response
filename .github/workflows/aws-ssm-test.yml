
name: AWS SSM Connectivity Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ssm-test:
    name: Test EC2 Remote Command
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: Project1SSMTest

      - name: Send test command to EC2
        id: command
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["date -u"]}' \
            --comment "Project 1 GitHub Actions SSM connectivity test" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM command submitted: $COMMAND_ID"

      - name: Verify remote execution
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          set -euo pipefail

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

